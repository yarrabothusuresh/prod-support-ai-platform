services:
  postgres:
    image: postgres:16-alpine
    container_name: prod-support-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: prod_support
      POSTGRES_USER: prod_support
      POSTGRES_PASSWORD: prod_support
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prod_support -d prod_support"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

server:
  port: 8081

spring:
  application:
    name: payment-service

prod-support:
  enabled: true
  application:
    name: payment-service
    team: payments
    description: Demo payment processing service
    environment: local
  diagnostics:
    health: true
    metrics: true
    errors: true
    dependencies: true
    max-error-retention: 100
  dependencies:
    - name: postgres-db
      type: DATABASE
      status: UP
    - name: notification-service
      type: HTTP
      status: UP
    - name: fraud-detection-api
      type: HTTP
      status: UP

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

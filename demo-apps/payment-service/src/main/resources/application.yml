server:
  port: 8081

spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-processing-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    template:
      observation-enabled: true
    listener:
      auto-startup: ${KAFKA_CONSUMER_AUTO_STARTUP:true}
      observation-enabled: true
  datasource:
    url: ${PAYMENT_DB_JDBC_URL:jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${PAYMENT_DB_USERNAME:sa}
    password: ${PAYMENT_DB_PASSWORD:}
    driver-class-name: ${PAYMENT_DB_DRIVER:org.h2.Driver}
    hikari:
      pool-name: PaymentHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false


prod-support:
  enabled: true
  application:
    name: payment-service
    team: payments
    description: Demo payment processing service
    environment: local
  tracing:
    enabled: true
    service-name: payment-service
    environment: local
  diagnostics:
    health: true
    metrics: true
    errors: true
    dependencies: true
    max-error-retention: 100
  dependencies:
    - name: postgres-db
      type: DATABASE
      status: UP
    - name: notification-service
      type: HTTP
      status: UP
    - name: fraud-detection-api
      type: HTTP
      status: UP

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      environment: ${prod-support.application.environment:local}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 2s
  opentelemetry:
    resource-attributes:
      service.name: payment-service
      service.version: 0.0.1-SNAPSHOT
      deployment.environment.name: local

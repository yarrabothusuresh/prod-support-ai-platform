server:
  port: 8082

spring:
  application:
    name: notification-service

prod-support:
  enabled: true
  application:
    name: notification-service
    team: notifications
    description: Demo downstream notification service
    environment: local
  tracing:
    enabled: true
    service-name: notification-service
    environment: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      timeout: 2s
  opentelemetry:
    resource-attributes:
      service.name: notification-service
      service.version: 0.0.1-SNAPSHOT
      deployment.environment.name: local

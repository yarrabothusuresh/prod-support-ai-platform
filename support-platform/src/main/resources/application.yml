server:
  port: 8080

spring:
  application:
    name: support-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prod_support}
    username: ${SPRING_DATASOURCE_USERNAME:prod_support}
    password: ${SPRING_DATASOURCE_PASSWORD:prod_support}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3:latest}
          temperature: 0.2
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: false
        schema-validation: false
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW

prod-support:
  ai:
    provider: ollama
    model: ${OLLAMA_CHAT_MODEL:llama3:latest}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
    log-prompt: false
    context-timeout-seconds: 3
    diagnostic-timeout-seconds: 3
    max-tool-calls: 10
    tool-calling:
      enabled: true
      deterministic-fallback: true
      max-tool-calls: 10
  tracing:
    enabled: true
    jaeger-base-url: ${JAEGER_BASE_URL:http://localhost:16686}
    default-window-minutes: 15
    maximum-window-minutes: 120
    default-result-limit: 20
    maximum-result-limit: 50
    request-timeout: 3s
    search-timeout: 3s
  knowledge:
    base-directory: ./documents
    chunk-size: 800
    chunk-overlap: 120
    max-context-chars: 12000
    default-top-k: 5
    max-top-k: 10
    minimum-similarity: 0.60
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimensions: 768
  kafka:
    enabled: true
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    request-timeout: 5s
    max-groups-per-request: 20
    max-partitions-per-request: 100
    lag:
      warning-threshold: 100
      critical-threshold: 1000
  diagnostics:
    timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info

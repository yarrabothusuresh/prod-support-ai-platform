server:
  port: 8080

spring:
  application:
    name: support-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prod_support}
    username: ${SPRING_DATASOURCE_USERNAME:prod_support}
    password: ${SPRING_DATASOURCE_PASSWORD:prod_support}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
